name: Windows environment diagnostic
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: windows-latest
    steps:
      - name: Diagnose isolated SMB options
        shell: pwsh
        run: |
          Write-Host '--- services and port ---'
          Get-Service LanmanServer,WebClient -ErrorAction SilentlyContinue | Format-List *
          Get-NetTCPConnection -LocalPort 445 -ErrorAction SilentlyContinue | Format-List *
          netstat -ano | Select-String ':445'
          Write-Host '--- docker ---'
          docker version
          docker info
          Write-Host '--- wsl ---'
          wsl --status
          wsl -l -v
