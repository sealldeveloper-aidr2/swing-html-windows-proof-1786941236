name: Windows Swing proof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test rendered HTTP NTLM
        shell: pwsh
        run: |
          python -m pip install impacket
          $p = Start-Process python -ArgumentList 'ntlmcap.py' -RedirectStandardOutput ntlm.out -RedirectStandardError ntlm.err -PassThru
          Start-Sleep -Seconds 3
          javac SwingWindowsProof.java
          java SwingWindowsProof
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host '--- NTLM STDOUT ---'
          Get-Content ntlm.out -ErrorAction SilentlyContinue
          Write-Host '--- NTLM STDERR ---'
          Get-Content ntlm.err -ErrorAction SilentlyContinue
