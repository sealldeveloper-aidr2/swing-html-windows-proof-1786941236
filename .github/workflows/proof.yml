name: Windows Swing proof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run
        shell: cmd
        run: |
          javac SwingWindowsProof.java
          java SwingWindowsProof
