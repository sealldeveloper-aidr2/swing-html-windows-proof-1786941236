name: Windows Swing proof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test container SMB capture
        shell: pwsh
        run: |
          python -m pip install impacket
          docker pull mcr.microsoft.com/windows/servercore:ltsc2025
          $repoPath = (Get-Location).Path
          $pythonPath = (Split-Path (Get-Command python).Source -Parent)
          Write-Host "repo=$repoPath python=$pythonPath"
          docker run -d --name smbcap -v "${repoPath}:C:\work" -v "${pythonPath}:C:\python" mcr.microsoft.com/windows/servercore:ltsc2025 C:\python\python.exe C:\work\smbcap.py
          Start-Sleep -Seconds 8
          docker ps -a
          docker logs smbcap
          $ip = docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' smbcap
          Write-Host "SMB container IP=$ip"
          javac SwingWindowsProof.java
          $env:SMBHOST = $ip
          java SwingWindowsProof
          Write-Host '--- SMB CONTAINER LOG ---'
          docker logs smbcap
