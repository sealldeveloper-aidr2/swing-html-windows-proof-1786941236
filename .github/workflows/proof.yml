name: Windows Swing proof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test rendered jar-file UNC
        shell: pwsh
        run: |
          python -m pip install impacket
          Stop-Service LanmanServer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $p = Start-Process python -ArgumentList 'smbcap.py' -RedirectStandardOutput smb.out -RedirectStandardError smb.err -PassThru
          Start-Sleep -Seconds 5
          javac SwingWindowsProof.java
          java SwingWindowsProof
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host '--- SMB STDOUT ---'
          Get-Content smb.out -ErrorAction SilentlyContinue
          Write-Host '--- SMB STDERR ---'
          Get-Content smb.err -ErrorAction SilentlyContinue
